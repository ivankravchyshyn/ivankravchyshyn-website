<!doctype html><meta charset="utf-8"><title>1536 visual diff</title><style>html,body{margin:0;background:#111;color:#fff;font:14px sans-serif}canvas{display:block}#summary{position:fixed;z-index:2;top:8px;left:8px;background:#000c;padding:8px}</style><div id="summary">Loading…</div><canvas id="diff"></canvas><script>
const name=new URLSearchParams(location.search).get('page')||'homepage';
const load=src=>new Promise((resolve,reject)=>{const image=new Image;image.onload=()=>resolve(image);image.onerror=reject;image.src=src});
Promise.all([load(`screenshots/baseline/${name}-1536.png`),load(`screenshots/corrected/${name}-1536.png`)]).then(([before,after])=>{
 const width=Math.max(before.width,after.width),height=Math.max(before.height,after.height),scratch=document.createElement('canvas'),ctx=scratch.getContext('2d',{willReadFrequently:true});scratch.width=width;scratch.height=height;
 ctx.drawImage(before,0,0);const a=ctx.getImageData(0,0,width,height);ctx.clearRect(0,0,width,height);ctx.drawImage(after,0,0);const b=ctx.getImageData(0,0,width,height),out=new ImageData(width,height);let changed=0,total=width*height,sum=0;
 for(let i=0;i<a.data.length;i+=4){const d=Math.max(Math.abs(a.data[i]-b.data[i]),Math.abs(a.data[i+1]-b.data[i+1]),Math.abs(a.data[i+2]-b.data[i+2]),Math.abs(a.data[i+3]-b.data[i+3]));if(d>8)changed++;sum+=d;out.data[i]=d;out.data[i+1]=0;out.data[i+2]=0;out.data[i+3]=d?255:35}
 const canvas=document.getElementById('diff');canvas.width=width;canvas.height=height;canvas.getContext('2d').putImageData(out,0,0);window.diffResult={name,width,height,changed,total,changedPercent:changed/total*100,meanDifference:sum/total};document.getElementById('summary').textContent=JSON.stringify(window.diffResult);
});
</script>
